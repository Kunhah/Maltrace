# Build maltrace desktop bundles and attach them to a GitHub Release.
#
# Triggers:
#   - Pushing a tag matching `v*` (e.g. `v0.2.0`) — bundles for every platform
#     and uploads to a draft release.
#   - `workflow_dispatch` — manual run, builds but doesn't publish.
#
# IMPORTANT: the bundles produced here contain the Tauri binary only — they
# do NOT include the Python sidecars or a SpiderFoot checkout. End-users
# still need to run `scripts/setup.sh` once after install to provision the
# Python venvs. Bundling Python is tracked separately; this workflow is the
# baseline that gets a single-file installer into people's hands.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact_glob: |
              app/src-tauri/target/release/bundle/deb/*.deb
              app/src-tauri/target/release/bundle/appimage/*.AppImage
          - platform: macos-14
            artifact_glob: |
              app/src-tauri/target/release/bundle/dmg/*.dmg
              app/src-tauri/target/release/bundle/macos/*.app.tar.gz
          - platform: windows-2022
            artifact_glob: |
              app/src-tauri/target/release/bundle/msi/*.msi
              app/src-tauri/target/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri prerequisites
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsoup-3.0-dev \
            patchelf

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install npm deps
        working-directory: app
        run: npm ci

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: app
          # Don't auto-create a release — we attach in a follow-up step so
          # all platforms' artifacts end up in the same draft.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "maltrace ${{ github.ref_name }}"
          releaseBody: |
            ## Install

            Download the bundle for your platform below.

            **First-time setup (one extra step):** the bundle ships the
            desktop app only. After installing, you still need to clone
            this repo and run `scripts/setup.sh` once to provision the
            Python sidecars (SpiderFoot, face-search, brazuca). This
            limitation will go away once sidecar bundling lands.

            ```bash
            git clone https://github.com/<owner>/<repo>.git
            cd <repo>
            ./scripts/setup.sh
            ```

            Then launch maltrace normally from your applications menu.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false

      - name: Upload bundles as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: warn
